<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a59">
<title>Livro de Colorir da Família</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>🎨 Livro de Colorir da Família</h1>
  <nav class="tabs">
    <button data-tab="prompts" class="on">Prompts</button>
    <button data-tab="gallery">Galeria</button>
  </nav>
</header>

<main>
  <section id="prompts" class="tab on">
    <div class="bar">
      <input id="search" type="search" placeholder="Buscar cena, personagem…">
      <label class="chk"><input id="useNeg" type="checkbox"> incluir negativo ao copiar</label>
      <button id="copyBlocks" class="ghost">Copiar blocos fixos</button>
    </div>
    <div id="progress" class="progress"></div>
    <div id="chapters"></div>
  </section>

  <section id="gallery" class="tab">
    <p class="hint">Páginas com imagem enviada. Toque para pintar. Importe também qualquer desenho em preto e branco.</p>
    <div class="bar"><button id="importFree">+ Importar desenho</button></div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<div id="painter" class="painter" hidden>
  <div class="ptop">
    <button id="pBack">← Voltar</button>
    <strong id="pTitle"></strong>
    <span class="sp"></span>
    <button id="pUndo">↶ Desfazer</button>
    <button id="pClear">Limpar</button>
    <button id="pSave">⬇ PNG</button>
  </div>
  <div class="stage"><div id="wrap" class="wrap"><canvas id="cColor"></canvas><canvas id="cLine"></canvas></div></div>
  <div class="ptools">
    <div class="modes">
      <button data-mode="bucket" class="on">🪣 Balde</button>
      <button data-mode="brush">🖌 Pincel</button>
      <button data-mode="eraser">🧽 Borracha</button>
      <input id="size" type="range" min="4" max="60" value="18" title="Tamanho do pincel">
    </div>
    <div id="palette" class="palette"></div>
  </div>
</div>

<input id="file" type="file" accept="image/*" hidden>
<div id="toast" class="toast" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
